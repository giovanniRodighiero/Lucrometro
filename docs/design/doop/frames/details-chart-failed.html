<!doctype html>
<html>
<!-- Doop frame "Details · chart failed (stale header)" (ysEbtRvZXk), 412x892. Snapshot: instance ids and the <style data-doop-tokens>/webfonts blocks
     are omitted; token values are in ../tokens.json, components in ../components/. -->
<head><meta charset="utf-8"><style>* { margin: 0; box-sizing: border-box; }</style></head>
<body style="width:412px;height:892px;position:relative;overflow:hidden;background:var(--color-surface);font-family:var(--font-sans);color:var(--color-on-surface);">
<doop-use component="StatusBar"></doop-use>
<doop-use component="DetailsTopBar" title="ENEL.MI" market="none"></doop-use>
<doop-use component="QuoteHeader" state="stale" name="Enel S.p.A." price="7.964 EUR" stamp="Stale since 09:12"><template slot="change"><doop-use component="ChangeBadge" direction="down" value="-0.017 (-0.21%)"></doop-use></template></doop-use>
<div style="height:56px;"></div>
<doop-use component="PriceChart" state="error" direction="flat"><template slot="plot"></template></doop-use>
<nav aria-label="Chart range" style="display:flex;margin-top:var(--spacing-sm);padding:0 calc(var(--spacing-md) - var(--spacing-xs));">
<doop-use component="RangeTab" state="selected" label="1D"></doop-use>
<doop-use component="RangeTab" label="5D"></doop-use>
<doop-use component="RangeTab" label="1M"></doop-use>
<doop-use component="RangeTab" label="3M"></doop-use>
<doop-use component="RangeTab" label="6M"></doop-use>
<doop-use component="RangeTab" label="1Y"></doop-use>
<doop-use component="RangeTab" label="5Y"></doop-use>
<doop-use component="RangeTab" label="Max"></doop-use>
</nav>
<div style="position:absolute;left:0;right:0;bottom:0;height:24px;display:flex;align-items:center;justify-content:center;"><span style="width:108px;height:4px;border-radius:var(--radius-full);background:var(--color-on-surface);"></span></div>
</body>
</html>
