<!doctype html>
<html>
<!-- Doop frame "C · Font 130%, worst case (BKNG, 4-digit price)" (Erlfs5u2Qp), 412x440, top of the details screen. Snapshot: instance ids and the <style data-doop-tokens>/webfonts blocks
     are omitted; token values are in ../tokens.json, components in ../components/.
     The wrapper scales the text tokens by 1.3 to simulate the system font size. -->
<head><meta charset="utf-8"><style>* { margin: 0; box-sizing: border-box; }</style></head>
<body style="width:412px;height:440px;position:relative;overflow:hidden;background:var(--color-surface);font-family:var(--font-sans);color:var(--color-on-surface);">
<div style="--text-display-small:46.8px;--leading-display-small:57.2px;--text-title-large:28.6px;--leading-title-large:36.4px;--text-title-medium:20.8px;--leading-title-medium:31.2px;--text-body-medium:18.2px;--leading-body-medium:26px;--text-body-small:15.6px;--leading-body-small:20.8px;--text-label-large:18.2px;--leading-label-large:26px;--text-label-medium:15.6px;--leading-label-medium:20.8px;">
<doop-use component="StatusBar"></doop-use>
<doop-use component="DetailsTopBar" title="BKNG" market="closed"></doop-use>
<doop-use component="QuoteHeader" kind="stock" name="Booking Holdings Inc." price="5,123.45 USD" stamp="Mon 24 Nov, 16:00"><template slot="change"><doop-use component="ChangeBadge" direction="down" value="-61.20 (-1.18%)"></doop-use></template></doop-use>
<doop-use component="PreMarketStrip" direction="down" price="5,098.20" change="-0.49%" time="08:32 EST"></doop-use>
<doop-use component="ChartReadout" label="Previous close" value="5,184.65 USD"><template slot="change"></template></doop-use>
</div>
</body>
</html>
