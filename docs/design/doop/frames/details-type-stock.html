<!doctype html>
<html>
<!-- Doop frame "Details · stock (type in the name line)" (FPAt9DZC7C), 412x252, top of the details screen. Snapshot: instance ids and the <style data-doop-tokens>/webfonts blocks
     are omitted; token values are in ../tokens.json, components in ../components/. -->
<head><meta charset="utf-8"><style>* { margin: 0; box-sizing: border-box; }</style></head>
<body style="width:412px;height:252px;position:relative;overflow:hidden;background:var(--color-surface);font-family:var(--font-sans);color:var(--color-on-surface);">
<doop-use component="StatusBar"></doop-use>
<doop-use component="DetailsTopBar" title="ENI.MI" privacy="private" refresh="on"></doop-use>
<doop-use component="QuoteHeader" kind="stock" name="Eni S.p.A." price="14.86 EUR" stamp="Today, 14:32"><template slot="change"><doop-use component="ChangeBadge" direction="down" value="-0.12 (-0.83%)"></doop-use></template></doop-use>
</body>
</html>
