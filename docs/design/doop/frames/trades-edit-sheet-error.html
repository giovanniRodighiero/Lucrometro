<!doctype html>
<html>
<!-- Doop frame "Trades · edit trade sheet (sell too large)" (9jZvW1sgjl), 412x892. Snapshot: instance ids and the <style data-doop-tokens>/webfonts blocks
     are omitted; token values are in ../tokens.json, components in ../components/. -->
<head><meta charset="utf-8"><style>* { margin: 0; box-sizing: border-box; }
.yh { height:48px; display:flex; align-items:flex-end; padding:0 var(--spacing-md) var(--spacing-sm); font-size:var(--text-label-large); line-height:var(--leading-label-large); font-weight:var(--font-weight-medium); color:var(--color-on-surface-variant); }
.two { display:grid; grid-template-columns:1fr 1fr; gap:var(--spacing-md); margin-top:var(--spacing-md); }
.ln { display:flex; justify-content:space-between; gap:var(--spacing-md); font-variant-numeric:tabular-nums; }
.ln b { font-weight:var(--font-weight-regular); color:var(--color-on-surface); }
</style></head>
<body style="width:412px;height:892px;position:relative;overflow:hidden;background:var(--color-surface);font-family:var(--font-sans);color:var(--color-on-surface);">
<doop-use component="StatusBar"></doop-use>
<doop-use component="TradesTopBar" title="Trades" ticker="SMH.MI"></doop-use>
<p style="padding:var(--spacing-xs) var(--spacing-md) var(--spacing-sm);font-size:var(--text-body-medium);line-height:var(--leading-body-medium);color:var(--color-on-surface-variant);font-variant-numeric:tabular-nums;">130 shares · avg 40.70 EUR · 13 trades</p>
<p class="yh">2026</p>
<doop-use component="TradeRow" side="buy" day="18" month="Nov" shares="10 shares" time="11:20" price="40.35 EUR" amount="403.50 EUR"></doop-use>
<doop-use component="TradeRow" side="buy" day="6" month="Nov" shares="10 shares" time="10:41" price="42.85 EUR" amount="428.50 EUR"></doop-use>
<div style="position:absolute;inset:0;background:var(--color-scrim);opacity:0.32;"></div>
<div style="position:absolute;left:0;right:0;bottom:0;">
<doop-use component="BottomSheet"><template slot="content">
<h2 style="font-size:var(--text-title-large);line-height:var(--leading-title-large);font-weight:var(--font-weight-regular);">Edit trade</h2>
<div style="margin-top:var(--spacing-md);"><doop-use component="SegmentedButton" selected="second" first="Buy" second="Sell"></doop-use></div>
<div class="two">
<doop-use component="TextField" trailing="calendar" label="Date" value="2 Oct 2026" supporting=" "></doop-use>
<doop-use component="TextField" trailing="clock" label="Time (optional)" value="15:02" supporting="Exchange time"></doop-use>
</div>
<div class="two">
<doop-use component="TextField" state="error" label="Shares" value="200" supporting="You had 140 on 2 Oct"></doop-use>
<doop-use component="TextField" label="Price (EUR)" value="43.10" supporting="Per share, without fees"></doop-use>
</div>
<p style="margin-top:var(--spacing-md);font-size:var(--text-body-medium);line-height:var(--leading-body-medium);color:var(--color-on-surface-variant);font-variant-numeric:tabular-nums;">Amount 8,620.00 EUR</p>
<div style="margin-top:var(--spacing-md);display:flex;align-items:center;gap:var(--spacing-sm);"><doop-use component="Button" tone="text" label="Delete"></doop-use><span style="flex:1;"></span><doop-use component="Button" tone="text" label="Cancel"></doop-use><doop-use component="Button" tone="filled" state="disabled" label="Save"></doop-use></div>
<div style="height:24px;"></div>
</template></doop-use>
</div>
<div style="position:absolute;left:0;right:0;bottom:0;height:24px;display:flex;align-items:center;justify-content:center;"><span style="width:108px;height:4px;border-radius:var(--radius-full);background:var(--color-on-surface);"></span></div>
</body></html>
