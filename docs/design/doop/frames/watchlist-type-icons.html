<!doctype html>
<html>
<!-- Doop frame "Watchlist · type icon after the code (pie = ETF, building = stock), piggy bank tab" (BZbLjePuME), 412x892. Snapshot: instance ids and the <style data-doop-tokens>/webfonts blocks
     are omitted; token values are in ../tokens.json, components in ../components/. -->
<head><meta charset="utf-8"><style>* { margin: 0; box-sizing: border-box; }</style></head>
<body style="width:412px;height:892px;position:relative;overflow:hidden;background:var(--color-surface);font-family:var(--font-sans);color:var(--color-on-surface);">
<doop-use component="StatusBar"></doop-use>
<doop-use component="TopAppBar" privacy="private"></doop-use>
<main style="display:flex;flex-direction:column;">
<doop-use component="QuoteRow" kind="etf" ticker="SMH.MI" name="VanEck Semiconductor UCITS ETF" price="41.27 EUR"><template slot="change"><doop-use component="ChangeBadge" direction="up" value="+2.14%"></doop-use></template></doop-use>
<doop-use component="QuoteRow" kind="etf" ticker="VWCE.MI" name="Vanguard FTSE All-World UCITS ETF" price="134.58 EUR"><template slot="change"><doop-use component="ChangeBadge" direction="up" value="+0.42%"></doop-use></template></doop-use>
<doop-use component="QuoteRow" kind="etf" ticker="SWDA.MI" name="iShares Core MSCI World UCITS ETF" price="108.92 EUR"><template slot="change"><doop-use component="ChangeBadge" direction="up" value="+0.37%"></doop-use></template></doop-use>
<doop-use component="QuoteRow" kind="stock" ticker="ENI.MI" name="Eni S.p.A." price="14.86 EUR"><template slot="change"><doop-use component="ChangeBadge" direction="down" value="-0.83%"></doop-use></template></doop-use>
<doop-use component="QuoteRow" kind="stock" ticker="ISP.MI" name="Intesa Sanpaolo S.p.A." price="5.412 EUR"><template slot="change"><doop-use component="ChangeBadge" direction="up" value="+1.06%"></doop-use></template></doop-use>
<doop-use component="QuoteRow" kind="stock" ticker="UCG.MI" name="UniCredit S.p.A." price="63.75 EUR"><template slot="change"><doop-use component="ChangeBadge" direction="flat" value="0.00%"></doop-use></template></doop-use>
<doop-use component="QuoteRow" kind="stock" ticker="RACE.MI" name="Ferrari N.V." price="352.40 EUR"><template slot="change"><doop-use component="ChangeBadge" direction="down" value="-1.48%"></doop-use></template></doop-use>
</main>
<div style="position:absolute;right:var(--spacing-md);bottom:120px;"><doop-use component="Fab"></doop-use></div>
<div style="position:absolute;left:0;right:0;bottom:0;background:var(--color-surface-container);padding-bottom:24px;">
<doop-use component="NavBar" selected="watchlist"></doop-use>
<div style="position:absolute;left:0;right:0;bottom:0;height:24px;display:flex;align-items:center;justify-content:center;"><span style="width:108px;height:4px;border-radius:var(--radius-full);background:var(--color-on-surface);"></span></div>
</div>
</body>
</html>
