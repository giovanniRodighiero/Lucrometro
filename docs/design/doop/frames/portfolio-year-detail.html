<!doctype html>
<html>
<!-- Doop frame "Year detail · 2025 (yours, then each ETF's market return)" (Fv5w7QJ3B_), 412x892. Snapshot: instance ids and the <style data-doop-tokens>/webfonts blocks
     are omitted; token values are in ../tokens.json, components in ../components/. -->
<head><meta charset="utf-8"><style>* { margin: 0; box-sizing: border-box; }</style></head>
<body style="width:412px;height:892px;position:relative;overflow:hidden;background:var(--color-surface);font-family:var(--font-sans);color:var(--color-on-surface);">
<doop-use component="StatusBar"></doop-use>
<doop-use component="DetailsTopBar" market="none" refresh="off" privacy="none" title="2025"></doop-use>
<main style="display:flex;flex-direction:column;font-variant-numeric:tabular-nums;">
<section style="margin:var(--spacing-sm) var(--spacing-md) 0;padding:var(--spacing-md);border-radius:var(--radius-lg);background:var(--color-surface-container-low);">
<p style="font-size:var(--text-body-small);line-height:var(--leading-body-small);color:var(--color-on-surface-variant);">Your portfolio in 2025</p>
<div style="margin-top:var(--spacing-sm);"><doop-use component="ChangeBadge" direction="up" value="+3,980.70 (+14.29%)"></doop-use></div>
<dl style="margin-top:var(--spacing-md);padding-top:var(--spacing-md);border-top:1px solid var(--color-outline-variant);display:grid;grid-template-columns:1fr 1fr 1fr;column-gap:var(--spacing-sm);">
<div><dt style="font-size:var(--text-body-small);line-height:var(--leading-body-small);color:var(--color-on-surface-variant);">1 Jan</dt><dd style="font-size:var(--text-body-medium);line-height:var(--leading-body-medium);">26,300.00</dd></div>
<div><dt style="font-size:var(--text-body-small);line-height:var(--leading-body-small);color:var(--color-on-surface-variant);">Added</dt><dd style="font-size:var(--text-body-medium);line-height:var(--leading-body-medium);">+6,200.00</dd></div>
<div><dt style="font-size:var(--text-body-small);line-height:var(--leading-body-small);color:var(--color-on-surface-variant);">31 Dec</dt><dd style="font-size:var(--text-body-medium);line-height:var(--leading-body-medium);">36,480.70</dd></div>
</dl>
<p style="margin-top:var(--spacing-sm);font-size:var(--text-body-small);line-height:var(--leading-body-small);color:var(--color-on-surface-variant);">EUR. Added = buys minus sells. The % weighs each buy by how long it was invested.</p>
</section>
<section style="padding:var(--spacing-lg) var(--spacing-md) var(--spacing-xs);">
<h2 style="font-size:var(--text-title-medium);line-height:var(--leading-title-medium);font-weight:var(--font-weight-medium);">Each holding, full year</h2>
<p style="margin-top:2px;font-size:var(--text-body-small);line-height:var(--leading-body-small);color:var(--color-on-surface-variant);">The market's return from 1 Jan to 31 Dec, dividends included. Yours differs if you bought during the year.</p>
</section>
<doop-use component="QuoteRow" ticker="UCG.MI" name="UniCredit S.p.A." price="58.10 EUR"><template slot="change"><doop-use component="ChangeBadge" direction="up" value="+28.75%"></doop-use></template></doop-use>
<doop-use component="QuoteRow" ticker="SMH.MI" name="VanEck Semiconductor UCITS ETF" price="38.62 EUR"><template slot="change"><doop-use component="ChangeBadge" direction="up" value="+34.10%"></doop-use></template></doop-use>
<doop-use component="QuoteRow" ticker="ISP.MI" name="Intesa Sanpaolo S.p.A." price="5.084 EUR"><template slot="change"><doop-use component="ChangeBadge" direction="up" value="+22.40%"></doop-use></template></doop-use>
<doop-use component="QuoteRow" ticker="VWCE.MI" name="Vanguard FTSE All-World UCITS ETF" price="128.10 EUR"><template slot="change"><doop-use component="ChangeBadge" direction="up" value="+14.62%"></doop-use></template></doop-use>
<doop-use component="QuoteRow" ticker="SWDA.MI" name="iShares Core MSCI World UCITS ETF" price="104.35 EUR"><template slot="change"><doop-use component="ChangeBadge" direction="up" value="+13.85%"></doop-use></template></doop-use>
</main>
<div style="position:absolute;left:0;right:0;bottom:0;height:24px;display:flex;align-items:center;justify-content:center;"><span style="width:108px;height:4px;border-radius:var(--radius-full);background:var(--color-on-surface);"></span></div>
</body></html>
