<!doctype html>
<html>

<head><meta charset="utf-8"><style>* { margin: 0; box-sizing: border-box; }</style></head>
<body style="width:412px;height:892px;position:relative;overflow:hidden;background:var(--color-surface);font-family:var(--font-sans);color:var(--color-on-surface);">
<doop-use component="StatusBar"></doop-use>
<doop-use component="TopAppBar" privacy="private" action="import" title="Portfolio" stamp="Updated 14:32"></doop-use>
<main style="display:flex;flex-direction:column;">

<doop-use component="Button" tone="filled" state="enabled" label="Import trades"></doop-use>
</div>
</section>
<section style="padding:var(--spacing-lg) var(--spacing-md) 0;">
<h2 style="font-size:var(--text-title-medium);line-height:var(--leading-title-medium);font-weight:var(--font-weight-medium);">Not counted</h2>
<p style="margin-top:2px;font-size:var(--text-body-small);line-height:var(--leading-body-small);color:var(--color-on-surface-variant);">Average price only: add their trades to count them.</p>
</section>

<div style="position:absolute;left:0;right:0;bottom:0;height:24px;display:flex;align-items:center;justify-content:center;"><span style="width:108px;height:4px;border-radius:var(--radius-full);background:var(--color-on-surface);"></span></div>
