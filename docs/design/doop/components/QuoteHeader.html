<!--
  Component: QuoteHeader (Doop id ca637a8jm0, rev 6)
  Details screen header: instrument name, the last price on its own row (display size, tabular figures), then one row
  with the day change on the left and the stamp pushed to the right edge (space-between). The stamp wraps below the
  change if both do not fit (large font scale). Decisions 0013, 0014.
  Props: state fresh|stale = fresh; name; price (with currency code);
         stamp: fresh = the quote's own time ("Today, 14:32", or the session day when the market is closed,
         "Fri 14 Nov, 17:35"); stale = "Stale since HH:mm" (tertiary colour, muted price).
  Slot: change (a ChangeBadge with the day change, abs and %)
-->
<section class="qh" data-state="fresh" style="display:flex;flex-wrap:wrap;align-items:center;column-gap:var(--spacing-sm);row-gap:var(--spacing-xs);padding:var(--spacing-sm) var(--spacing-md) var(--spacing-md);font-family:var(--font-sans);"><p data-doop-prop="name" style="flex-basis:100%;font-size:var(--text-body-medium);line-height:var(--leading-body-medium);color:var(--color-on-surface-variant);">VanEck Semiconductor UCITS ETF</p><p class="qh-price" data-doop-prop="price" style="flex-basis:100%;font-size:var(--text-display-small);line-height:var(--leading-display-small);font-weight:var(--font-weight-regular);font-variant-numeric:tabular-nums;white-space:nowrap;">41.27 EUR</p><span data-doop-slot="change" style="display:flex;margin-top:var(--spacing-xs);"></span><p class="qh-stamp" data-doop-prop="stamp" style="margin-top:var(--spacing-xs);margin-left:auto;font-size:var(--text-body-small);line-height:var(--leading-body-small);font-variant-numeric:tabular-nums;white-space:nowrap;">Today, 14:32</p></section>
<style>
.qh { color: var(--color-on-surface); }
.qh-price { color: var(--color-on-surface); }
.qh-stamp { color: var(--color-on-surface-variant); }
.qh[data-state="stale"] .qh-price { color: var(--color-on-surface-variant); }
.qh[data-state="stale"] .qh-stamp { color: var(--color-tertiary); }
</style>
