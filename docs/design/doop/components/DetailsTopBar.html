<!--
  Component: DetailsTopBar (Doop id cw5r7g8fav, rev 5)
  Material 3 small top app bar for the details screen (decision 0035): back arrow (48dp touch target), the ticker code
  as title, then on the right a market marker and the auto-refresh sync icon button.
  Props: title (ticker code; cut with an ellipsis when it does not fit);
         market none|open|closed = open; refresh off|on = off.
  Marker: 8dp dot and one word, "Open" (filled gain dot) or "Closed" (hollow outline dot), neutral text, 48dp touch
  target. Tapping it opens the market details sheet (frames/details-market-sheet), which holds the full status text of
  decision 0032 ("Open · closes 17:30", exchange clock and phone clock, see frames/market-status-cases).
  Icon: 48dp sync button. refresh=off: plain. refresh=on: tonal secondary-container fill, polling is running (the chart's
  last point also gets a halo, see frames/details-auto-refresh-on). market=closed: shown disabled (38%), whatever
  `refresh` says. market=none hides the marker and the icon (chart fetch failed, or hours unknown).
  The text carries the meaning; the dot only supports it. Never red for closed: red means loss in the app.
  Before decision 0035 the right side was the full status text (rev 4, decisions 0014, 0027, 0032).
-->

<style>
