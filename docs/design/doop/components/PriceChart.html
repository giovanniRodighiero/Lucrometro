<!--
  Component: PriceChart (Doop id cngdxi4dgd, rev 4)
  The details price chart area, 412x292 (324 until the position work, decision 0033; custom drawing in Compose:
  Canvas, not a Material component).
  Props: state ready|error = ready; direction up|down|flat = up (sign of the selected range's change: sets the line
         colour to gain / loss / on-surface-variant).
  Slot: plot (ready state). Geometry used by every frame: plot x 16-352, y 12-256; price labels in the right gutter
        from x 360 (body-small, tabular); time labels on the bottom row at y 280; 1px outline-variant gridlines at
        round prices; 2px line in currentColor; area fill = currentColor 22% -> 0% top to bottom; 5px end dot with a
        2px surface ring. 1D only: dashed 1px on-surface-variant baseline at the previous close, its label in medium
        weight; the line stops at the last quote (the rest of the 09:00-17:30 session stays empty).
        Scrub: 1px on-surface vertical line at the finger plus a 6px dot on the line.
  Position (decisions 0033, 0040), only when the owner saved an average:
        Average: 1.5px dotted tertiary line (dasharray 0.1 5, round caps) across the plot, "Your avg" above its left
        end (11px medium tertiary), its price in the gutter in tertiary medium. Outside the axis range the axis is
        never stretched: a short dotted stub at the plot edge, a chevron and the price in the gutter.
        No last-buy mark: the diamond of decision 0034 is removed in M1 (decision 0040). The latest buy returns in
        the private view (M2), at its date and price.
  Error state: no chart (never a stale one), "Couldn't fetch" with a Retry button (PRD 4).
-->
