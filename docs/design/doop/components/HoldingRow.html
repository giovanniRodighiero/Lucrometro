<!--
  Component: HoldingRow (Doop id c9q6s133py, rev 2)
  M4 (decision 0049): one held ticker in the Portfolio tab's composition list, sorted by weight, largest first; tap
  opens its details. Ticker and name on the left (name ellipsized), weight in % of the total on the right, value in
  EUR under it, and a 4dp bar whose primary fill is the weight out of 100%.
  M5 (decision 0057): also the rows of the "By type" section (ticker "ETFs" / "Stocks", name "3 holdings"; not
  tappable), shown in private (with value) and public (view=public, % only).
  Props: view private|public = private (public hides the value); kind none|etf|stock = none: the 16dp type icon after
         the ticker, as on the watchlist (pie_chart = ETF, business = stock); bar (CSS width, e.g. "34.5%"), ticker,
         weight, name, value: text.
  One role colour for every row: a donut with a colour per ticker would need fixed hues and break dynamic colour.
-->
