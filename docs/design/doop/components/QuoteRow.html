<!--
  Component: QuoteRow (Doop id c5b5wp6o8o, rev 4)
  One watchlist row: ticker code and name on the left, last price and day change on the right.
  Props: state fresh|stale|error = fresh; kind none|etf|stock = none (M5, decision 0057); ticker; name;
         note (shown only when stale, e.g. "Stale since 09:12");
         price (with currency code, or "Couldn't fetch" in the error state)
  kind: a 16dp on-surface-variant icon right after the code, 6dp gap: pie_chart = ETF, business (building) = stock.
        Content description "ETF" / "Stock". none = no icon (any other Yahoo type; frames drawn before M5).
  Slot: change (put a ChangeBadge in it; empty in the error state)
-->

<style>
.row .price { font-size: var(--text-body-large); color: var(--color-on-surface); }
