<!--
  Component: PortfolioSummary (Doop id c9cyps4s3t, rev 4)
  M4 (decisions 0049, 0050, 0053): the total card at the top of the Portfolio tab.
  Props: view private|public = private.
           private: "Total value" (shares x latest price, summed) in display-small; then two full-width change lines,
           each a ChangeBadge followed by its label: today's change (slot today, amount and %, label "Today") and the
           change since you bought (slot since: value - invested, amount and %, label "Since you bought"); then a
           divider and one line "Invested" (label left, amount right). The badges get the card's full width so they
           never wrap at the normal font size (rev 3 put Invested and Since you bought side by side: the badge wrapped).
           public: "Your portfolio" / the number of holdings (prop holdings), the same two change lines in % only, no
           divider and no Invested line.
         freshness fresh|stale = fresh: stale adds a tertiary line after the change lines (prop stale, "2 prices stale
           since 10:41") when any price in the total is stale.
         value, invested, holdings, stale: text.
  The "realized" slot is retired (0050) and always hidden. Wrap in a div with 16px side margins.
-->
<section class="pfs" data-view="private" data-freshness="fresh" aria-label="Portfolio total" style="padding:var(--spacing-md);border-radius:var(--radius-lg);background:var(--color-surface-container-low);font-family:var(--font-sans);color:var(--color-on-surface);font-variant-numeric:tabular-nums;"><p class="pfs-priv" style="font-size:var(--text-body-small);line-height:var(--leading-body-small);color:var(--color-on-surface-variant);">Total value</p><p class="pfs-priv" data-doop-prop="value" style="font-size:var(--text-display-small);line-height:var(--leading-display-small);">42,899.20 EUR</p><p class="pfs-pub" style="font-size:var(--text-body-small);line-height:var(--leading-body-small);color:var(--color-on-surface-variant);">Your portfolio</p><p class="pfs-pub" data-doop-prop="holdings" style="font-size:var(--text-headline-small);line-height:var(--leading-headline-small);">5 holdings</p><div class="pfs-line" style="display:flex;flex-wrap:wrap;align-items:center;column-gap:var(--spacing-sm);margin-top:var(--spacing-sm);min-height:32px;"><span data-doop-slot="today" data-doop-slot-suggest="ChangeBadge"></span><span style="font-size:var(--text-body-small);line-height:var(--leading-body-small);color:var(--color-on-surface-variant);">Today</span></div><div class="pfs-line" style="display:flex;flex-wrap:wrap;align-items:center;column-gap:var(--spacing-sm);margin-top:var(--spacing-xs);min-height:32px;"><span data-doop-slot="since" data-doop-slot-suggest="ChangeBadge"></span><span style="font-size:var(--text-body-small);line-height:var(--leading-body-small);color:var(--color-on-surface-variant);">Since you bought</span></div><p class="pfs-stale" data-doop-prop="stale" style="margin-top:var(--spacing-sm);font-size:var(--text-body-small);line-height:var(--leading-body-small);color:var(--color-tertiary);">2 prices stale since 10:41</p><div class="pfs-inv pfs-priv" style="margin-top:var(--spacing-md);padding-top:var(--spacing-md);border-top:1px solid var(--color-outline-variant);justify-content:space-between;align-items:baseline;gap:var(--spacing-md);"><span style="font-size:var(--text-body-small);line-height:var(--leading-body-small);color:var(--color-on-surface-variant);">Invested</span><span data-doop-prop="invested" style="font-size:var(--text-body-medium);line-height:var(--leading-body-medium);">37,650.00 EUR</span></div><div class="pfs-real" data-doop-slot="realized" data-doop-slot-suggest="ChangeBadge"></div></section>
<style>
.pfs p { margin: 0; }
.pfs .pfs-real { display: none !important; }
.pfs .pfs-stale, .pfs .pfs-pub { display: none; }
.pfs .pfs-inv { display: flex; }
.pfs[data-freshness="stale"] .pfs-stale { display: block; }
.pfs[data-view="public"] .pfs-priv { display: none; }
.pfs[data-view="public"] .pfs-pub { display: block; }
</style>
