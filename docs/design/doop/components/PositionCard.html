<!--
  Component: PositionCard (Doop id ck5u26pzly, rev 3)
  Details screen, under the range bar: the owner's own position in the ticker. Wrap in a div with 16px side margins.
  Props: state empty|avg|full = full;
         empty: nothing saved yet, "Own this? Add the average price..." and an "Add average price" text button;
         avg (public view, decision 0040, M1): the average price copied from the broker and the change since it.
           No shares, no hint, no footer;
         full: PARKED for M2 (private view, built from the trade log). Average, shares, value and change, with a
           footer that will open the buy history. Not built in M1; M2 redesigns it.
         avg, shares, value: text with currency ("40.70 EUR", "120", "4,952.40 EUR");
         lastbuy: footer text, full only (M2).
  Slot: change (a ChangeBadge with the change since the average, abs and %).
  The edit pencil (48dp touch target) opens the edit sheet; the dotted swatch before "Avg price" matches the chart line.
-->
<section class="poc" data-state="full" aria-label="Your position" style="padding:var(--spacing-xs) var(--spacing-md) 0;border-radius:var(--radius-lg);background:var(--color-surface-container-low);font-family:var(--font-sans);color:var(--color-on-surface);"><div style="display:flex;align-items:center;justify-content:space-between;height:var(--spacing-touch);"><h2 style="font-size:var(--text-title-medium);line-height:var(--leading-title-medium);font-weight:var(--font-weight-medium);">Your position</h2><span class="poc-edit" aria-label="Edit position" style="width:48px;height:48px;margin-right:-12px;align-items:center;justify-content:center;color:var(--color-on-surface-variant);"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"></path></svg></span></div><p class="poc-empty" style="font-size:var(--text-body-medium);line-height:var(--leading-body-medium);color:var(--color-on-surface-variant);">Own this? Add the average price from your broker to see it on the chart.</p><div class="poc-add" style="margin:var(--spacing-xs) 0 0 -12px;padding-bottom:var(--spacing-sm);"><doop-use component="Button" label="Add average price" tone="text"></doop-use></div><dl class="poc-grid" style="grid-template-columns:1fr 1fr;row-gap:var(--spacing-lg);column-gap:var(--spacing-md);font-variant-numeric:tabular-nums;"><div style="grid-area:avg;"><dt style="font-size:var(--text-body-small);line-height:var(--leading-body-small);color:var(--color-on-surface-variant);display:flex;align-items:center;gap:6px;"><svg width="14" height="4" viewBox="0 0 14 4"><line x1="2" y1="2" x2="13" y2="2" stroke="var(--color-tertiary)" stroke-width="1.5" stroke-dasharray="0.1 4" stroke-linecap="round"></line></svg>Avg price</dt><dd data-doop-prop="avg" style="font-size:var(--text-body-medium);line-height:var(--leading-body-medium);">40.70 EUR</dd></div><div class="poc-shares" style="grid-area:shares;"><dt style="font-size:var(--text-body-small);line-height:var(--leading-body-small);color:var(--color-on-surface-variant);">Shares</dt><dd data-doop-prop="shares" style="font-size:var(--text-body-medium);line-height:var(--leading-body-medium);">120</dd></div><div class="poc-value" style="grid-area:value;"><dt style="font-size:var(--text-body-small);line-height:var(--leading-body-small);color:var(--color-on-surface-variant);">Value</dt><dd data-doop-prop="value" style="font-size:var(--text-body-medium);line-height:var(--leading-body-medium);">4,952.40 EUR</dd></div><div style="grid-area:change;"><dt style="font-size:var(--text-body-small);line-height:var(--leading-body-small);color:var(--color-on-surface-variant);margin-bottom:2px;">Since avg</dt><dd data-doop-slot="change"></dd></div></dl><p class="poc-hint" style="margin-top:var(--spacing-md);font-size:var(--text-body-small);line-height:var(--leading-body-small);color:var(--color-on-surface-variant);">Add how many shares you own to see the value.</p><div class="poc-foot" style="margin-top:var(--spacing-md);border-top:1px solid var(--color-outline-variant);height:40px;align-items:center;gap:var(--spacing-sm);font-size:var(--text-body-small);line-height:var(--leading-body-small);color:var(--color-on-surface-variant);font-variant-numeric:tabular-nums;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20 3h-1V1h-2v2H7V1H5v2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 18H4V8h16v13z"></path></svg><span data-doop-prop="lastbuy">Last buy 28 Oct 2026</span></div></section>
<style>
.poc h2, .poc p, .poc dl, .poc dd { margin: 0; }
.poc .poc-edit { display: flex; }
.poc .poc-grid { display: grid; grid-template-areas: "avg shares" "value change"; }
.poc .poc-foot { display: flex; }
.poc .poc-empty, .poc .poc-add, .poc .poc-hint { display: none; }
.poc[data-state="avg"] .poc-grid { grid-template-areas: "avg change"; padding-bottom: var(--spacing-md); }
.poc[data-state="avg"] .poc-shares, .poc[data-state="avg"] .poc-value, .poc[data-state="avg"] .poc-foot { display: none; }
.poc[data-state="empty"] .poc-edit, .poc[data-state="empty"] .poc-grid, .poc[data-state="empty"] .poc-foot { display: none; }
.poc[data-state="empty"] .poc-empty { display: block; }
.poc[data-state="empty"] .poc-add { display: flex; }
</style>
